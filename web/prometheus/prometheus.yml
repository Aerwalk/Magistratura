global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertrules.yml

scrape_configs:
  - job_name: "magsim-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # HTTP service probes (healthz, metrics, UI, Grafana API)
  - job_name: "magsim-probes"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://backend:8000/healthz"
          - "http://backend:8000/api/health"
          - "http://backend:8000/metrics"
          - "http://frontend:80/"
          - "http://grafana:3000/api/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP port probes for non-HTTP services
  - job_name: "magsim-tcp-probes"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - "backend:8000"
          - "frontend:80"
          - "grafana:3000"
          - "prometheus:9090"
          - "timescale:5432"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115