server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    pipeline_stages:
      - docker:
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - .*
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_network_ip']
        target_label: 'container_ip'
      - source_labels: ['__meta_docker_label_com_docker_compose_service']
        target_label: 'service_name'
      - source_labels: ['__meta_docker_label_com_docker_compose_project']
        target_label: 'compose_project'
      - action: replace
        source_labels: ['container']
        regex: 'magsim-robot-agent-\d+'
        replacement: 'magsim-robot-agent'
        target_label: 'container'