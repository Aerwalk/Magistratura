apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - matcherRegex: traceID=(\w+)
          name: TraceID
          url: ${__value.raw}
          urlDisplayLabel: Open in Traces
        - matcherRegex: 'trace_id[": ]+([0-9a-f]+)'
          name: TraceID
          internalLink: true
          datasourceUid: tempo
          url: ${__value.raw}
          urlDisplayLabel: Open in Traces